# Prasang local stack. `docker compose up -d` then `bash scripts/stack-health.sh`.
# Ports are bound to localhost only.
name: prasang

x-backend: &backend
  build: ./backend
  image: prasang-backend:local
  environment:
    ENV: local
    DATABASE_URL: postgresql+asyncpg://prasang:prasang@postgres:5432/prasang
    ELASTICSEARCH_URL: http://elasticsearch:9200
    TEMPORAL_ADDRESS: temporal:7233
    SUPERTOKENS_URI: http://supertokens:3567
    SUPERTOKENS_API_KEY: local-supertokens-key
    # The browser talks to the API through the Vite dev server (same origin), so both domains are the web origin.
    API_DOMAIN: http://localhost:5173
    WEBSITE_DOMAIN: http://localhost:5173
    CORS_ORIGINS: '["http://localhost:5173"]'
    DEV_AUTH_HEADER: "true"
    SEED_ROOT: /seed
    # Optional integrations — set in a root .env file (see .env.example)
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    SUPPORT_PHONE: ${SUPPORT_PHONE:-}
    BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
    S3_BUCKET: ${S3_BUCKET:-}
    PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
    AWS_REGION: ${AWS_REGION:-ap-south-1}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    # Payments, email and SMS switch on by themselves once their credentials are set.
    PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-auto}
    PHONEPE_ENV: ${PHONEPE_ENV:-sandbox}
    PHONEPE_CLIENT_ID: ${PHONEPE_CLIENT_ID:-}
    PHONEPE_CLIENT_SECRET: ${PHONEPE_CLIENT_SECRET:-}
    PHONEPE_CLIENT_VERSION: ${PHONEPE_CLIENT_VERSION:-1}
    PHONEPE_WEBHOOK_USERNAME: ${PHONEPE_WEBHOOK_USERNAME:-}
    PHONEPE_WEBHOOK_PASSWORD: ${PHONEPE_WEBHOOK_PASSWORD:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    EMAIL_SENDER: ${EMAIL_SENDER:-Prasang <hello@prasang.in>}
    MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
    MSG91_SMS_TEMPLATE_OTP: ${MSG91_SMS_TEMPLATE_OTP:-}
    MSG91_SMS_TEMPLATE_LEAD: ${MSG91_SMS_TEMPLATE_LEAD:-}
    MSG91_SMS_TEMPLATE_LEAD_LOCKED: ${MSG91_SMS_TEMPLATE_LEAD_LOCKED:-}
    MSG91_SMS_TEMPLATE_WELCOME_ARTIST: ${MSG91_SMS_TEMPLATE_WELCOME_ARTIST:-}
    MSG91_SMS_TEMPLATE_WELCOME_PLANNER: ${MSG91_SMS_TEMPLATE_WELCOME_PLANNER:-}
    MSG91_SMS_TEMPLATE_TRIAL_ENDING: ${MSG91_SMS_TEMPLATE_TRIAL_ENDING:-}
    MSG91_SMS_TEMPLATE_PAYMENT_LINK: ${MSG91_SMS_TEMPLATE_PAYMENT_LINK:-}
    MSG91_SMS_TEMPLATE_RENEWAL_DUE: ${MSG91_SMS_TEMPLATE_RENEWAL_DUE:-}
    MSG91_SMS_TEMPLATE_PAYMENT_RECEIVED: ${MSG91_SMS_TEMPLATE_PAYMENT_RECEIVED:-}
    MSG91_SMS_TEMPLATE_PLAN_ENDED: ${MSG91_SMS_TEMPLATE_PLAN_ENDED:-}
    MSG91_SMS_TEMPLATE_MEDIA_REMOVAL: ${MSG91_SMS_TEMPLATE_MEDIA_REMOVAL:-}
    MSG91_SMS_TEMPLATE_BOOKING_CHECK: ${MSG91_SMS_TEMPLATE_BOOKING_CHECK:-}
    MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER:-}
    MSG91_WHATSAPP_TEMPLATE_OTP: ${MSG91_WHATSAPP_TEMPLATE_OTP:-}
    MSG91_WHATSAPP_TEMPLATE_LEAD: ${MSG91_WHATSAPP_TEMPLATE_LEAD:-}
    MSG91_WHATSAPP_TEMPLATE_LEAD_LOCKED: ${MSG91_WHATSAPP_TEMPLATE_LEAD_LOCKED:-}
    MSG91_WHATSAPP_TEMPLATE_WELCOME_ARTIST: ${MSG91_WHATSAPP_TEMPLATE_WELCOME_ARTIST:-}
    MSG91_WHATSAPP_TEMPLATE_WELCOME_PLANNER: ${MSG91_WHATSAPP_TEMPLATE_WELCOME_PLANNER:-}
    MSG91_WHATSAPP_TEMPLATE_TRIAL_ENDING: ${MSG91_WHATSAPP_TEMPLATE_TRIAL_ENDING:-}
    MSG91_WHATSAPP_TEMPLATE_PAYMENT_LINK: ${MSG91_WHATSAPP_TEMPLATE_PAYMENT_LINK:-}
    MSG91_WHATSAPP_TEMPLATE_RENEWAL_DUE: ${MSG91_WHATSAPP_TEMPLATE_RENEWAL_DUE:-}
    MSG91_WHATSAPP_TEMPLATE_PAYMENT_RECEIVED: ${MSG91_WHATSAPP_TEMPLATE_PAYMENT_RECEIVED:-}
    MSG91_WHATSAPP_TEMPLATE_PLAN_ENDED: ${MSG91_WHATSAPP_TEMPLATE_PLAN_ENDED:-}
    MSG91_WHATSAPP_TEMPLATE_MEDIA_REMOVAL: ${MSG91_WHATSAPP_TEMPLATE_MEDIA_REMOVAL:-}
    MSG91_WHATSAPP_TEMPLATE_BOOKING_CHECK: ${MSG91_WHATSAPP_TEMPLATE_BOOKING_CHECK:-}
    MSG91_WHATSAPP_LANGUAGE: ${MSG91_WHATSAPP_LANGUAGE:-en}
  volumes:
    - ./backend/app:/app/app
    - ./backend/alembic:/app/alembic
    - ./contracts:/seed/contracts:ro
    - ./mockoon/data:/seed/mockoon/data:ro

x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: prasang
  POSTGRES_PWD: prasang

services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: prasang
      POSTGRES_PASSWORD: prasang
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prasang -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    environment: *temporal-db
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    volumes: [./docker/temporal:/scripts:ro]
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure:5

  temporal:
    image: temporalio/server:1.32.1
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/dynamicconfig.yaml
    volumes: [./docker/temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig/dynamicconfig.yaml:ro]
    ports: ["127.0.0.1:7233:7233"]
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    environment: { TEMPORAL_ADDRESS: "temporal:7233" }
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    volumes: [./docker/temporal:/scripts:ro]
    depends_on:
      temporal: { condition: service_healthy }
    restart: on-failure:5

  temporal-ui:
    image: temporalio/ui:2.49.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      temporal: { condition: service_healthy }

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.3.1
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://prasang:prasang@postgres:5432/supertokens
      API_KEYS: local-supertokens-key
    ports: ["127.0.0.1:3567:3567"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e \"GET /hello HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q Hello <&3'"]
      interval: 5s
      timeout: 5s
      retries: 40

  # ---------- application ----------
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed --demo && python -m app.cli reindex"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    restart: on-failure:3

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      supertokens: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["python", "-m", "app.workflows.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }
    restart: unless-stopped

  projector:
    <<: *backend
    command: ["python", "-m", "app.cli", "project"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.cli", "sweep", "--loop", "300"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: prasang-web:local
    environment:
      VITE_AUTH_MODE: supertokens
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  esdata:
  web_node_modules:
